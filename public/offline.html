<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1877f2">
    <title>Hors connexion</title>
    <style>
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f0f2f5; color: #1c1917; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
        main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }

        p { margin: .25rem 0; color: #57534e; }
        p[dir="rtl"] { font-size: 1.05rem; }
        a { display: inline-block; margin-top: 1.25rem; padding: .6rem 1.2rem; border-radius: .6rem; background: #1877f2; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<main>
    <img src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1>Vous êtes hors connexion</h1>
    <p>Vérifiez votre connexion Internet puis réessayez.</p>
    <p dir="rtl" lang="ar">أنت غير متصل بالإنترنت. تحقق من الاتصال ثم أعد المحاولة.</p>
    <p lang="en">You are offline. Check your connection and try again.</p>
    <a href="/">Réessayer · إعادة المحاولة · Retry</a>
